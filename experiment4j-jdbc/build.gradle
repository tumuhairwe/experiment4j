// Optional plain-JDBC implementation of the experiment4j persistence
// interfaces. Adopters supply their own DataSource; no extra dependencies.

description = 'experiment4j JDBC: persist experiment state with plain JDBC'

dependencies {
    api project(':experiment4j-core')

    // the store contract tests shared by every implementation
    testImplementation testFixtures(project(':experiment4j-core'))
    testImplementation 'com.h2database:h2:2.3.232'
}

// Fail the build (and CI) if coverage drops below these minimums. Set below
// the measured level (line 98.6%, branch 90.9%); the remaining gaps are
// defensive SQL-error and race paths.
tasks.named('jacocoTestCoverageVerification') {
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.95
            }
            limit {
                counter = 'BRANCH'
                minimum = 0.85
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
