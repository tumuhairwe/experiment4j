// The experimentation engine. Keep this module free of framework and
// persistence dependencies; integrations belong in their own modules.

description = 'experiment4j core: run, compare and publish control/candidate experiments'

def lombokVersion = '1.18.42'
dependencies {
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
}

// Fail the build (and CI) if coverage drops below these minimums.
// Set just below the measured level (line 97.3%, branch 82.5%); raise them
// as coverage improves.
tasks.named('jacocoTestCoverageVerification') {
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.95
            }
            limit {
                counter = 'BRANCH'
                minimum = 0.80
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
